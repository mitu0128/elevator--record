name: Update Data
on:
  workflow_dispatch:
    inputs:
      data:
        description: data
        required: true
      message:
        description: message
        required: false
        default: update
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: write
        env:
          PAYLOAD: ${{ inputs.data }}
        run: echo "$PAYLOAD" > data.json
      - name: commit
        run: |
          git config user.name "bot"
          git config user.email "mitu0128@users.noreply.github.com"
          git add data.json
          git commit -m "${{ inputs.message }}" || true
          git push
