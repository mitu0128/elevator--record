name: Update Data
on:
  workflow_dispatch:
    inputs:
      data:
        description: data
        required: true
      message:
        description: message
        required: false
        default: update
permissions:
  contents: write
  actions: read
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: write
        env:
          PAYLOAD: ${{ inputs.data }}
        run: |
          ls -la
          printf '%s' "$PAYLOAD" > data.json
          cat data.json
      - name: commit
        env:
          TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config user.name "bot"
          git config user.email "mitu0128@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${TOKEN}@github.com/mitu0128/elevator--record.git
          git add data.json
          git commit -m "${{ inputs.message }}" || true
          git push
