<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小区楼栋电梯信息记录</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --green: #16a34a; --green-dark: #15803d; --blue: #2563eb; --amber: #d97706;
    --red: #dc2626; --gray: #6b7280; --bg: #f3f4f6; --card: #ffffff;
    --border: #e5e7eb; --text: #1f2937;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); padding-bottom: 90px; }
  .header { background: linear-gradient(135deg, var(--green), var(--green-dark)); color: #fff; padding: 16px; position: sticky; top: 0; z-index: 50; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
  .header h1 { font-size: 19px; font-weight: 700; }
  .header .sub { font-size: 12px; opacity: .9; margin-top: 2px; }
  .status-bar { margin-top: 8px; font-size: 12px; background: rgba(0,0,0,.18); border-radius: 6px; padding: 6px 8px; word-break: break-all; }
  .status-ok { color: #a7f3d0; }
  .status-err { color: #fecaca; }
  .toolbar { display: flex; gap: 8px; padding: 12px 16px; align-items: center; flex-wrap: wrap; background: var(--card); border-bottom: 1px solid var(--border); position: sticky; top: 56px; z-index: 40; }
  .toolbar input { flex: 1; min-width: 120px; padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; }
  .btn { padding: 9px 14px; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .btn-primary { background: var(--green); color: #fff; }
  .btn-primary:active { background: var(--green-dark); }
  .btn-ghost { background: #fff; color: var(--text); border: 1px solid var(--border); }
  .btn-danger { background: var(--red); color: #fff; }
  .btn-sm { padding: 6px 10px; font-size: 13px; border-radius: 6px; }
  .list { padding: 12px 16px; }
  .card { background: var(--card); border-radius: 12px; padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .card-title { font-size: 17px; font-weight: 700; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .card-title .name { flex: 1; }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: #eef2ff; color: var(--blue); font-weight: 600; }
  .row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed var(--border); font-size: 15px; }
  .row:last-child { border-bottom: none; }
  .row .k { color: var(--gray); }
  .row .v { font-weight: 600; text-align: right; }
  .empty { text-align: center; color: var(--gray); padding: 60px 20px; font-size: 15px; }
  .fab { position: fixed; right: 20px; bottom: 24px; width: 58px; height: 58px; border-radius: 50%; background: var(--green); color: #fff; font-size: 30px; border: none; box-shadow: 0 4px 14px rgba(22,163,74,.5); cursor: pointer; z-index: 60; display: none; }
  .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 100; display: none; align-items: flex-end; }
  .modal-mask.show { display: flex; }
  .modal { background: #fff; width: 100%; border-radius: 16px 16px 0 0; padding: 20px; max-height: 85vh; overflow-y: auto; }
  .modal h2 { font-size: 18px; margin-bottom: 16px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 14px; color: var(--gray); margin-bottom: 5px; }
  .field input, .field select, .field textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 16px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 8px; }
  .modal-actions .btn { flex: 1; }
  .toast { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.85); color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 14px; z-index: 200; max-width: 85vw; text-align: center; }
  .toast.err { background: var(--red); }
  .debug-box { margin: 12px 16px; background: #111827; color: #a7f3d0; border-radius: 10px; padding: 12px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; white-space: pre-wrap; word-break: break-all; display: none; }
  .debug-box.show { display: block; }
  .debug-box .e { color: #fecaca; }
</style>
</head>
<body>

<div class="header">
  <h1>小区楼栋电梯信息记录</h1>
  <div class="sub">数据云端同步 · 多设备共享</div>
  <div class="status-bar" id="statusBar">正在初始化 Firebase…</div>
</div>

<div class="toolbar">
  <input type="text" id="searchInput" placeholder="搜索小区名称">
  <button class="btn btn-ghost btn-sm" id="loginBtn">🔑 登录</button>
</div>

<div class="debug-box" id="debugBox"></div>

<div class="list" id="list"></div>
<div class="empty" id="emptyMsg" style="display:none;">还没有小区记录，点右下角 + 添加</div>

<button class="fab" id="fab">＋</button>

<!-- 登录弹窗 -->
<div class="modal-mask" id="loginModal">
  <div class="modal">
    <h2>管理员登录</h2>
    <div class="field">
      <label>密码</label>
      <input type="password" id="pwdInput" placeholder="请输入管理密码">
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" data-close="loginModal">取消</button>
      <button class="btn btn-primary" id="doLogin">登录</button>
    </div>
  </div>
</div>

<!-- 小区弹窗 -->
<div class="modal-mask" id="commModal">
  <div class="modal">
    <h2 id="commModalTitle">添加小区</h2>
    <div class="field"><label>小区名称 *</label><input id="f_name" placeholder="如：阳光花园"></div>
    <div class="field"><label>楼栋数量</label><input id="f_buildings" type="number" placeholder="如：8"></div>
    <div class="field"><label>电梯品牌</label><input id="f_brand" placeholder="如：三菱"></div>
    <div class="field"><label>维保公司</label><input id="f_maint" placeholder="如：XX电梯维保"></div>
    <div class="field"><label>下次检验日期</label><input id="f_nextCheck" type="date"></div>
    <div class="field"><label>备注</label><textarea id="f_note" rows="2"></textarea></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" data-close="commModal">取消</button>
      <button class="btn btn-primary" id="saveComm">保存</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
<script>
(function(){
  "use strict";

  var ADMIN_PWD = "520";
  var COLLECTION = "communities";
  var statusBar = document.getElementById("statusBar");
  var debugBox = document.getElementById("debugBox");
  var logs = [];

  function log(msg, isErr){ logs.push((isErr?"[ERR] ":"[OK]  ") + msg); debugBox.textContent = logs.join("\n"); }
  function setStatus(html, cls){ statusBar.innerHTML = html; statusBar.className = "status-bar" + (cls?" "+cls:""); }
  function toast(msg, err){ var t=document.createElement("div"); t.className="toast"+(err?" err":""); t.textContent=msg; document.body.appendChild(t); setTimeout(function(){t.remove();},2400); }

  var state = { data: [], isAdmin: false, firebaseOk: false, editingId: null };
  var DB = null; // firestore reference

  /* ---------- Firebase 初始化 ---------- */
  function initFirebase(){
    try {
      if (typeof firebase === "undefined") { log("firebase SDK 未加载（CDN 被拦截？）", true); setStatus("云端：Firebase SDK 加载失败 · 使用本地存储", "status-err"); return; }
      log("firebase SDK 已加载，版本 " + (firebase.SDK_VERSION || "?"));
      var cfg = {
        apiKey: "AIzaSyA7OK3ybIJazOjrjhZdZeZZTbzPZRVz1tY",
        authDomain: "elevator-record.firebaseapp.com",
        projectId: "elevator-record"
      };
      firebase.initializeApp(cfg);
      log("initializeApp 成功");
      var db = firebase.firestore();
      log("firestore 实例获取成功");
      // 测试连通性
      db.collection("__ping").doc("test").set({ t: Date.now() }, { merge: true })
        .then(function(){ log("连通测试写入成功 ✅"); })
        .catch(function(e){ log("连通测试写入失败：" + (e && e.message), true); });
      DB = db;
      state.firebaseOk = true;
      setStatus("云端：已连接 · 读取中…", "status-ok");
      bindSync();
      loadFromCloud();
    } catch (e) {
      log("init 异常：" + (e && e.message), true);
      setStatus("云端：初始化失败 · 使用本地存储", "status-err");
    }
  }

  function bindSync(){
    if (!DB) return;
    try {
      DB.collection(COLLECTION).onSnapshot(function(snap){
        log("onSnapshot 回调，文档数=" + snap.size);
        var arr = [];
        snap.forEach(function(d){ var o=d.data(); o.id=d.id; arr.push(o); });
        arr.sort(function(a,b){ return (a.name||"").localeCompare(b.name||"","zh"); });
        state.data = arr;
        render();
        saveLocal(arr);
      }, function(err){
        log("onSnapshot 错误：" + (err && err.message), true);
        setStatus("云端：监听失败 · 使用本地存储", "status-err");
      });
    } catch(e){ log("bindSync 异常：" + (e&&e.message), true); }
  }

  function loadFromCloud(){
    if (!DB) return;
    DB.collection(COLLECTION).get()
      .then(function(snap){
        log("首轮 get 成功，文档数=" + snap.size);
        if (snap.size === 0) setStatus("云端：已连接 · 暂无数据，可开始添加", "status-ok");
      })
      .catch(function(e){ log("首轮 get 失败：" + (e&&e.message), true); setStatus("云端：读取失败 · 使用本地存储", "status-err"); });
  }

  /* ---------- 本地存储兜底 ---------- */
  function saveLocal(arr){ try { localStorage.setItem("elevator_data", JSON.stringify(arr)); } catch(e){} }
  function loadLocal(){ try { var s=localStorage.getItem("elevator_data"); return s?JSON.parse(s):[]; } catch(e){ return []; } }

  /* ---------- 渲染 ---------- */
  function render(){
    var list = document.getElementById("list");
    var kw = (document.getElementById("searchInput").value||"").trim().toLowerCase();
    var arr = state.data.filter(function(d){ return !kw || (d.name||"").toLowerCase().indexOf(kw)>=0; });
    document.getElementById("emptyMsg").style.display = (state.data.length===0) ? "block" : "none";
    list.innerHTML = "";
    arr.forEach(function(d){
      var card=document.createElement("div"); card.className="card";
      var html='<div class="card-title"><span class="name">'+esc(d.name)+'</span><span class="badge">'+(d.buildings||"?")+'栋</span></div>';
      html+=row("电梯品牌", d.brand||"—");
      html+=row("维保公司", d.maint||"—");
      html+=row("下次检验", d.nextCheck||"—");
      if (d.note) html+=row("备注", d.note);
      if (state.isAdmin){
        html+='<div style="margin-top:10px;display:flex;gap:8px;">';
        html+='<button class="btn btn-ghost btn-sm" data-act="edit" data-id="'+d.id+'">✏️ 编辑</button>';
        html+='<button class="btn btn-danger btn-sm" data-act="del" data-id="'+d.id+'">🗑 删除</button>';
        html+='</div>';
      }
      card.innerHTML=html;
      list.appendChild(card);
    });
  }
  function row(k,v){ return '<div class="row"><span class="k">'+k+'</span><span class="v">'+esc(v)+'</span></div>'; }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

  /* ---------- 写入 ---------- */
  function saveCommunity(obj){
    if (!state.firebaseOk || !DB){ toast("云端未连接，已存到本机", true); render(); return; }
    var id = obj.id || DB.collection(COLLECTION).doc().id;
    obj.id = id; obj.updatedAt = Date.now();
    DB.collection(COLLECTION).doc(id).set(obj).then(function(){
      log("写入成功 id=" + id);
      toast("已保存到云端");
    }).catch(function(e){
      log("写入失败：" + (e&&e.message), true);
      toast("云端写入失败：" + (e&&e.message), true);
    });
  }
  function deleteCommunity(id){
    if (!confirm("确定删除这条记录？")) return;
    if (state.firebaseOk && DB){
      DB.collection(COLLECTION).doc(id).delete().then(function(){ toast("已删除"); }).catch(function(e){ toast("删除失败："+(e&&e.message),true); });
    } else { state.data=state.data.filter(function(d){return d.id!==id;}); saveLocal(state.data); render(); }
  }

  /* ---------- 交互 ---------- */
  document.getElementById("loginBtn").onclick=function(){ document.getElementById("loginModal").classList.add("show"); document.getElementById("pwdInput").focus(); };
  document.getElementById("doLogin").onclick=function(){
    if (document.getElementById("pwdInput").value===ADMIN_PWD){
      state.isAdmin=true; document.getElementById("loginBtn").textContent="✔ 已登录";
      document.getElementById("fab").style.display="block";
      closeModal("loginModal"); document.getElementById("pwdInput").value="";
      toast("登录成功"); render();
    } else { toast("密码错误", true); }
  };
  document.getElementById("fab").onclick=function(){ openCommModal(null); };
  document.getElementById("saveComm").onclick=function(){
    var name=document.getElementById("f_name").value.trim();
    if(!name){ toast("请填写小区名称",true); return; }
    var obj={ id: state.editingId||null, name: name,
      buildings: document.getElementById("f_buildings").value,
      brand: document.getElementById("f_brand").value,
      maint: document.getElementById("f_maint").value,
      nextCheck: document.getElementById("f_nextCheck").value,
      note: document.getElementById("f_note").value };
    saveCommunity(obj);
    closeModal("commModal");
  };
  document.getElementById("searchInput").oninput=render;
  document.getElementById("list").onclick=function(e){
    var t=e.target.closest("[data-act]"); if(!t)return;
    var act=t.dataset.act, id=t.dataset.id;
    if(act==="edit"){ var d=state.data.filter(function(x){return x.id===id;})[0]; openCommModal(d); }
    if(act==="del"){ deleteCommunity(id); }
  };
  document.querySelectorAll("[data-close]").forEach(function(b){ b.onclick=function(){ closeModal(b.dataset.close); }; });
  function closeModal(id){ document.getElementById(id).classList.remove("show"); }

  function openCommModal(d){
    state.editingId = d?d.id:null;
    document.getElementById("commModalTitle").textContent = d?"编辑小区":"添加小区";
    document.getElementById("f_name").value = d?d.name:"";
    document.getElementById("f_buildings").value = d?d.buildings:"";
    document.getElementById("f_brand").value = d?d.brand:"";
    document.getElementById("f_maint").value = d?d.maint:"";
    document.getElementById("f_nextCheck").value = d?d.nextCheck:"";
    document.getElementById("f_note").value = d?d.note:"";
    document.getElementById("commModal").classList.add("show");
  }

  // 启动：先尝试云端，失败兜底本地
  initFirebase();
  if (!state.firebaseOk){
    state.data = loadLocal();
    render();
  }
})();
</script>
</body>
</html>
