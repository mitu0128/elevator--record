<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小区楼栋电梯信息记录</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; color: #333; padding-bottom: 80px; }
.header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; padding: 16px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
.header h1 { font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.header-top { display: flex; justify-content: space-between; align-items: center; }
.admin-badge { display: inline-block; background: rgba(255,255,255,.25); font-size: 11px; padding: 2px 8px; border-radius: 10px; margin-left: 6px; }
.admin-badge.hidden { display: none; }
.btn-login { background: rgba(255,255,255,.2); border: 1px solid rgba(255,255,255,.4); color: #fff; font-size: 12px; padding: 4px 12px; border-radius: 14px; cursor: pointer; }
.btn-login.hidden { display: none; }
.btn-logout { background: rgba(255,255,255,.2); border: 1px solid rgba(255,255,255,.4); color: #fff; font-size: 12px; padding: 4px 12px; border-radius: 14px; cursor: pointer; }
.btn-logout.hidden { display: none; }
.search-box { margin-top: 10px; position: relative; }
.search-box input { width: 100%; padding: 10px 36px 10px 36px; border: none; border-radius: 20px; font-size: 14px; outline: none; background: rgba(255,255,255,.9); }
.search-box .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 14px; opacity: .5; }
.search-box .clear-btn { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); width: 24px; height: 24px; border: none; background: #ddd; border-radius: 50%; font-size: 12px; cursor: pointer; display: none; align-items: center; justify-content: center; line-height: 1; }
.search-box .clear-btn.show { display: flex; }
.result-count { font-size: 12px; opacity: .8; margin-top: 6px; }
.container { padding: 16px; }
.card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.08); cursor: pointer; transition: transform .15s; }
.card:active { transform: scale(.98); }
.card-header { display: flex; justify-content: space-between; align-items: center; }
.card-title { font-size: 16px; font-weight: 600; }
.card-sub { font-size: 12px; color: #999; margin-top: 4px; }
.card-actions { display: flex; gap: 8px; }
.btn-icon { width: 32px; height: 32px; border: none; border-radius: 50%; background: #f0f0f0; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.btn-icon:active { background: #e0e0e0; }
.btn-icon.disabled { opacity: .3; pointer-events: none; }
.stats-bar { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 16px; display: flex; justify-content: space-around; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
.stat-item { text-align: center; }
.stat-num { font-size: 24px; font-weight: 700; }
.stat-label { font-size: 12px; color: #999; margin-top: 2px; }
.stat-total .stat-num { color: #667eea; }
.stat-yes .stat-num { color: #2e7d32; }
.stat-no .stat-num { color: #c62828; }
.fab { position: fixed; bottom: 20px; right: 20px; width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(135deg, #667eea, #764ba2); border: none; color: #fff; font-size: 24px; box-shadow: 0 4px 12px rgba(102,126,234,.4); cursor: pointer; z-index: 100; }
.fab:active { transform: scale(.92); }
.fab.hidden { display: none; }
.modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.5); z-index: 200; display: none; align-items: flex-end; }
.modal-overlay.show { display: flex; }
.modal { background: #fff; border-radius: 20px 20px 0 0; width: 100%; padding: 24px; max-height: 80vh; overflow-y: auto; }
.modal h3 { margin-bottom: 16px; font-size: 18px; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 13px; color: #666; margin-bottom: 6px; }
.form-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; outline: none; }
.form-group input:focus { border-color: #667eea; }
.switch-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
.switch-row label { font-size: 15px; }
.switch { position: relative; width: 50px; height: 28px; background: #ccc; border-radius: 14px; cursor: pointer; transition: background .2s; }
.switch.on { background: #667eea; }
.switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 24px; height: 24px; background: #fff; border-radius: 50%; transition: transform .2s; }
.switch.on::after { transform: translateX(22px); }
.switch.disabled { opacity: .4; pointer-events: none; }
.modal-btns { display: flex; gap: 12px; margin-top: 20px; }
.modal-btns button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; }
.btn-cancel { background: #f5f5f5; color: #666; }
.btn-confirm { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; }
.empty-state { text-align: center; padding: 60px 20px; color: #999; }
.empty-state .icon { font-size: 48px; margin-bottom: 12px; }
.building-card { border-left: 4px solid #667eea; }
.building-card.no-elevator { border-left-color: #c62828; }
.building-card.yes-elevator { border-left-color: #2e7d32; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; cursor: pointer; }
.badge-yes { background: #e8f5e9; color: #2e7d32; }
.badge-no { background: #ffebee; color: #c62828; }
.badge.disabled { opacity: .4; pointer-events: none; }
.highlight { background: #fff3cd; color: #856404; padding: 0 2px; border-radius: 2px; font-weight: 600; }
.match-tag { display: inline-block; background: #e3f2fd; color: #1565c0; font-size: 11px; padding: 1px 6px; border-radius: 8px; margin-left: 6px; }
.sub-building { margin-left: 16px; border-radius: 8px; background: #f8f9ff; border: 1px solid #e8eaf6; }
.back-btn { background: none; border: none; color: #fff; font-size: 20px; margin-right: 8px; cursor: pointer; }
.page { display: none; }
.page.active { display: block; }
.alert-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.5); z-index: 300; display: none; align-items: center; justify-content: center; }
.alert-overlay.show { display: flex; }
.alert-box { background: #fff; border-radius: 12px; padding: 24px; width: 80%; max-width: 300px; text-align: center; }
.alert-box h4 { margin-bottom: 12px; }
.alert-box p { font-size: 14px; color: #666; margin-bottom: 16px; }
.alert-box button { padding: 10px 24px; border: none; border-radius: 8px; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; font-size: 14px; cursor: pointer; }
.alert-box .btn-cancel-alert { background: #f5f5f5; color: #666; margin-right: 8px; }
.toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.75); color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 13px; z-index: 400; opacity: 0; transition: opacity .3s; pointer-events: none; }
.toast.show { opacity: 1; }
.readonly-tip { text-align: center; font-size: 12px; color: #999; padding: 12px; display: none; }
.readonly-tip.show { display: block; }

/* 视图切换（列表 / 九宫格） */
.view-toggle { display: flex; gap: 4px; background: rgba(255,255,255,.2); border-radius: 16px; padding: 2px; margin-top: 10px; width: fit-content; }
.view-toggle button { border: none; background: transparent; color: rgba(255,255,255,.8); font-size: 12px; padding: 4px 14px; border-radius: 14px; cursor: pointer; transition: all .2s; }
.view-toggle button.active { background: #fff; color: #667eea; font-weight: 600; }
/* 九宫格 */
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.grid.hidden { display: none; }
/* 列表容器默认显示，与 .grid 互斥 */
#homeList.hidden { display: none; }
.grid-item { background: #fff; border-radius: 12px; padding: 14px 8px; text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,.08); cursor: pointer; transition: transform .15s; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 88px; position: relative; overflow: hidden; }
.grid-item:active { transform: scale(.96); }
.grid-item .grid-icon { font-size: 26px; margin-bottom: 6px; }
.grid-item .grid-name { font-size: 13px; font-weight: 600; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-all; }
.grid-item .grid-sub { font-size: 11px; color: #999; margin-top: 4px; }
.grid-item .grid-del { position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; border: none; border-radius: 50%; background: #f0f0f0; font-size: 11px; cursor: pointer; display: none; align-items: center; justify-content: center; line-height: 1; }
.grid-item .grid-del:active { background: #e0e0e0; }
.grid-item.admin .grid-del { display: flex; }
.grid-item.admin { padding-top: 18px; }

/* 管理员登录弹窗 */
.admin-login-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.5); z-index: 250; display: none; align-items: center; justify-content: center; }
.admin-login-overlay.show { display: flex; }
.admin-login-box { background: #fff; border-radius: 16px; padding: 28px 24px; width: 85%; max-width: 320px; text-align: center; }
.admin-login-box .admin-icon { font-size: 40px; margin-bottom: 10px; }
.admin-login-box h3 { margin-bottom: 16px; font-size: 17px; }
.admin-login-box input { width: 100%; padding: 11px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; outline: none; margin-bottom: 12px; text-align: center; }
.admin-login-box input:focus { border-color: #667eea; }
.admin-login-box button { width: 100%; padding: 11px; border: none; border-radius: 8px; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; font-size: 15px; cursor: pointer; margin-bottom: 10px; }
.admin-login-box .btn-cancel-login { background: #f5f5f5; color: #666; }
.admin-login-error { color: #c62828; font-size: 12px; margin-top: 8px; display: none; }
.admin-login-error.show { display: block; }

/* 数据管理（导出/导入）弹窗 */
.dm-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 260; display: none; align-items: center; justify-content: center; }
.dm-overlay.show { display: flex; }
.dm-box { background: #fff; border-radius: 16px; padding: 20px 18px; width: 88%; max-width: 340px; }
.dm-box h3 { font-size: 16px; margin-bottom: 4px; }
.dm-box .dm-sub { font-size: 12px; color: #999; margin-bottom: 16px; }
.dm-row { display: flex; align-items: center; gap: 12px; padding: 13px 10px; border-radius: 10px; background: #f7f7fb; margin-bottom: 10px; cursor: pointer; }
.dm-row:active { background: #eeeaf6; }
.dm-row.disabled { opacity: .35; pointer-events: none; }
.dm-icon { width: 38px; height: 38px; border-radius: 10px; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; font-size: 18px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.dm-icon.green { background: linear-gradient(135deg, #43a047, #66bb6a); }
.dm-text { flex: 1; }
.dm-text .dm-t { font-size: 15px; font-weight: 600; }
.dm-text .dm-d { font-size: 11px; color: #999; margin-top: 2px; }
.dm-arrow { color: #ccc; font-size: 16px; }
.dm-stat { font-size: 12px; color: #888; text-align: center; padding: 8px 0 4px; }
.dm-tip { font-size: 11px; color: #b71c1c; background: #fdecea; border-radius: 8px; padding: 8px 10px; line-height: 1.5; margin-top: 6px; }
/* 导入确认（替代原生 confirm，兼容性好） */
.dm-confirm-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 270; display: none; align-items: center; justify-content: center; }
.dm-confirm-overlay.show { display: flex; }
.dm-confirm-box { background: #fff; border-radius: 16px; padding: 22px 20px; width: 86%; max-width: 320px; text-align: center; }
.dm-confirm-box .dm-cm-icon { font-size: 38px; margin-bottom: 8px; }
.dm-confirm-box .dm-cm-q { font-size: 16px; font-weight: 700; margin-bottom: 14px; }
.dm-confirm-box .dm-cm-info { background: #f7f7fb; border-radius: 10px; padding: 12px; font-size: 13px; color: #444; line-height: 1.9; margin-bottom: 8px; }
.dm-confirm-box .dm-cm-info b { color: #667eea; }
.dm-confirm-box .dm-cm-warn { font-size: 11px; color: #b71c1c; background: #fdecea; border-radius: 8px; padding: 8px; line-height: 1.5; margin-bottom: 16px; }
.dm-confirm-box .dm-cm-btns { display: flex; gap: 12px; }
.dm-confirm-box .dm-cm-btns button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; }
.dm-confirm-box .dm-cm-ok { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; }
.dm-cm-ok.disabled { opacity: .4; pointer-events: none; }
.dm-confirm-box .dm-cm-cancel { background: #f5f5f5; color: #666; }
.dm-confirm-box .dm-cm-err { color: #b71c1c; font-size: 12px; margin-top: 10px; display: none; }

.dm-cm-compare { background: #f7f7fb; border-radius: 10px; padding: 12px; margin-bottom: 14px; text-align: left; }
.dm-cm-compare .dm-cv-line { font-size: 13px; color: #444; line-height: 1.9; }
.dm-cm-compare .dm-cv-line b { color: #667eea; }
.dm-cm-compare .dm-cv-tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 9px; margin-left: 4px; font-weight: 600; }
.dm-cm-compare .dm-cv-tag.new { background: #e8f5e9; color: #2e7d32; }
.dm-cm-compare .dm-cv-tag.upd { background: #fff3e0; color: #e65100; }
.dm-cm-compare .dm-cv-tag.same { background: #eceff1; color: #607d8b; }
.dm-cm-btns { flex-wrap: wrap; }
.dm-cm-merge-tip { font-size: 11px; color: #2e7d32; background: #e8f5e9; border-radius: 8px; padding: 8px 10px; line-height: 1.5; margin-bottom: 14px; }
.dm-confirm-box .dm-cm-err.show { display: block; }
/* 导入预览 */
.dm-preview { background: #f7f7fb; border-radius: 10px; padding: 12px; margin-bottom: 12px; }
.dm-preview .dm-pv-title { font-size: 12px; color: #999; margin-bottom: 8px; }
.dm-preview .dm-pv-line { font-size: 13px; color: #444; margin-bottom: 5px; }
.dm-preview .dm-pv-line span { font-weight: 700; color: #667eea; }

/* ===== 排序控件 ===== */
.sort-bar { display: flex; align-items: center; gap: 10px; background: #fff; border-radius: 12px; padding: 10px 14px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
.sort-label { font-size: 12px; color: #999; white-space: nowrap; }
.sort-tabs { display: flex; gap: 6px; flex: 1; }
.sort-tab { flex: 1; padding: 6px 0; border: none; border-radius: 8px; background: #f2f3f7; color: #555; font-size: 13px; cursor: pointer; transition: all .15s; white-space: nowrap; }
.sort-tab.active { background: linear-gradient(135deg,#667eea,#764ba2); color: #fff; font-weight: 600; }
.sort-tab:active { transform: scale(.96); }
</style>
</head>
<body>

<!-- 管理员登录弹窗 -->
<div class="admin-login-overlay" id="adminLoginOverlay">
  <div class="admin-login-box">
    <div class="admin-icon">🔑</div>
    <h3>管理员登录</h3>
    <p style="font-size:13px;color:#888;margin:-8px 0 12px;">仅需输入密码</p>
    <input type="password" id="adminPass" placeholder="请输入管理员密码" maxlength="20">
    <button onclick="doAdminLogin()">登录</button>
    <button class="btn-cancel-login" onclick="closeAdminLogin()">取消</button>
    <div class="admin-login-error" id="adminLoginError">密码错误</div>
  </div>
</div>

<!-- 数据管理：导出 / 导入 -->
<div class="dm-overlay" id="dataMgrOverlay">
  <div class="dm-box">
    <h3>📦 数据管理</h3>
    <div class="dm-sub" id="dmSub">换手机 / 防丢失，把数据备份到手机</div>
    <div class="dm-stat" id="dmStat"></div>
    <div class="dm-row" id="dmExportRow" onclick="doExport()">
      <div class="dm-icon">📤</div>
      <div class="dm-text">
        <div class="dm-t">导出备份</div>
        <div class="dm-d" id="dmExportDesc">生成备份文件，存到手机</div>
      </div>
      <div class="dm-arrow">›</div>
    </div>
    <div class="dm-row" id="dmImportRow" onclick="document.getElementById('dmFile').click()">
      <div class="dm-icon green">📥</div>
      <div class="dm-text">
        <div class="dm-t">导入恢复</div>
        <div class="dm-d">从备份文件恢复数据</div>
      </div>
      <div class="dm-arrow">›</div>
    </div>
    <div class="dm-tip">💡 建议：录入一批数据后就导出一次备份，换手机时把备份文件传到新手机再导入即可。</div>
    <button class="btn-cancel-login" style="width:100%;margin-top:12px;" onclick="closeDataMgr()">关闭</button>
  </div>
</div>
<input type="file" id="dmFile" accept=".json" style="display:none">

  </div>
</div>


<!-- 导入确认（自定义弹窗，替代原生 confirm，兼容性更好） -->
<div class="dm-confirm-overlay" id="importConfirmOverlay">
  <div class="dm-confirm-box">
    <div class="dm-cm-icon" id="dmCmIcon">📥</div>
    <div class="dm-cm-q" id="dmCmQ">确认导入这份备份？</div>
    <div class="dm-cm-info" id="dmCmInfo"></div>
    <div class="dm-cm-warn" id="dmCmWarn">⚠️ 导入后将替换当前所有数据，且无法撤销</div>
    <!-- 备份与当前数据对比（仅在存在新增/更新时出现） -->
    <div class="dm-cm-compare hidden" id="dmCmCompare"></div>
    <div class="dm-cm-btns">
      <button class="dm-cm-cancel" id="dmCmCancel">取消</button>
      <button class="dm-cm-ok" id="dmCmOk">确认导入</button>
      <button class="dm-cm-ok hidden" id="dmCmMerge">智能合并</button>
    </div>
    <div class="dm-cm-err" id="dmCmErr"></div>
  </div>
</div>

<!-- 首页：小区列表 -->
<div class="page active" id="pageHome">
  <div class="header">
    <div class="header-top">
      <h1>🏘️ 小区楼栋电梯记录<span class="admin-badge hidden" id="adminBadge">管理员</span></h1>
      <button class="btn-login" id="btnLogin" onclick="openAdminLogin()">登录</button>
      <button class="btn-login" id="btnDataMgr" onclick="openDataMgr()" title="数据管理">⚙️</button>
      <button class="btn-logout hidden" id="btnLogout" onclick="doAdminLogout()">退出</button>
    </div>
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchHome" placeholder="搜索小区名称/地址/楼栋号..." oninput="onSearchHome()">
      <button class="clear-btn" id="clearHome" onclick="clearSearchHome()">✕</button>
    </div>
    <div class="view-toggle">
      <button id="btnViewList" class="active" onclick="setHomeView('list')">☰ 列表</button>
      <button id="btnViewGrid" onclick="setHomeView('grid')">▦ 九宫格</button>
    </div>
    <div class="sort-bar">
      <span class="sort-label">排序</span>
      <div class="sort-tabs" id="homeSortTabs">
        <button class="sort-tab active" data-sort="input" onclick="setHomeSort('input')">录入顺序</button>
        <button class="sort-tab" data-sort="name" onclick="setHomeSort('name')">名称</button>
        <button class="sort-tab" data-sort="elevator" onclick="setHomeSort('elevator')">有电梯数</button>
      </div>
    </div>
    <div class="result-count" id="resultCountHome"></div>
  </div>
  <div class="container" id="homeList"></div>
  <div class="grid hidden" id="homeGrid"></div>
  <div class="readonly-tip" id="readonlyTipHome">当前为只读模式，登录管理员后可编辑</div>
  <button class="fab hidden" id="fabHome" onclick="openModal('community')">＋</button>
</div>

<!-- 楼栋列表页 -->
<div class="page" id="pageBuilding">
  <div class="header">
    <button class="back-btn" onclick="goBack()">‹</button>
    <h1 id="buildingTitle">楼栋列表</h1>
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchBuilding" placeholder="搜索楼栋号/备注..." oninput="onSearchBuilding()">
      <button class="clear-btn" id="clearBuilding" onclick="clearSearchBuilding()">✕</button>
    </div>
  </div>
  <div class="container">
    <div class="stats-bar">
      <div class="stat-item stat-total"><div class="stat-num" id="statTotal">0</div><div class="stat-label">总楼栋</div></div>
      <div class="stat-item stat-yes"><div class="stat-num" id="statYes">0</div><div class="stat-label">有电梯</div></div>
      <div class="stat-item stat-no"><div class="stat-num" id="statNo">0</div><div class="stat-label">无电梯</div></div>
    </div>
    <div class="sort-bar">
      <span class="sort-label">排序</span>
      <div class="sort-tabs" id="sortTabs">
        <button class="sort-tab active" data-sort="number" onclick="setSort('number')">楼栋号</button>
        <button class="sort-tab" data-sort="input" onclick="setSort('input')">录入顺序</button>
        <button class="sort-tab" data-sort="elevator" onclick="setSort('elevator')">有无电梯</button>
      </div>
    </div>
    <div id="buildingList"></div>
  </div>
  <div class="readonly-tip" id="readonlyTipBuilding">当前为只读模式，登录管理员后可编辑</div>
  <button class="fab hidden" id="fabBuilding" onclick="openModal('building')">＋</button>
</div>

<!-- 弹窗 -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3 id="modalTitle">添加</h3>
    <div class="form-group">
      <label id="label1"></label>
      <input type="text" id="input1" placeholder="">
    </div>
    <div class="form-group" id="group2">
      <label id="label2"></label>
      <input type="text" id="input2" placeholder="">
    </div>
    <div class="form-group" id="groupSwitch" style="display:none;">
      <label>是否有电梯</label>
      <div class="switch-row">
        <div class="switch on" id="elevatorSwitch" onclick="toggleSwitch()"></div>
        <label id="switchLabel">有电梯</label>
      </div>
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">取消</button>
      <button class="btn-confirm" onclick="confirmModal()">确定</button>
    </div>
  </div>
</div>

<!-- 确认弹窗 -->
<div class="alert-overlay" id="alert">
  <div class="alert-box">
    <h4 id="alertTitle">确认</h4>
    <p id="alertMsg"></p>
    <button class="btn-cancel-alert" onclick="closeAlert()">取消</button>
    <button onclick="doDelete()">确认删除</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== 配置 =====
const ADMIN_PASS = "520";             // 管理员密码（仅密码，无账号）

// ===== 状态 =====
// 用 var 声明，挂载到 window，避免被 script 闭包隔离导致外部访问不到
var data = JSON.parse(localStorage.getItem('elevatorData') || '{"communities":[],"buildings":[]}');
let currentCommunityId = null;
let modalType = '';
let deleteTarget = null;
let hasElevatorVal = true;
let isAdmin = false;  // 是否已登录管理员
let homeView = 'list'; // 首页视图：'list' 列表 / 'grid' 九宫格

// 用可变对象承载数据，避免 import 后 data 指向新对象却没同步回这里
const store = { data: JSON.parse(localStorage.getItem('elevatorData') || '{"communities":[],"buildings":[]}') };
// data 始终指向 store.data，防止 import 后指向新对象而 renderHome 读到旧引用
function save() { store.data = data; localStorage.setItem('elevatorData', JSON.stringify(data)); }
function syncData() { data = store.data; }


// ===== 管理员登录 =====
function openAdminLogin() {
  document.getElementById('adminPass').value = '';
  document.getElementById('adminLoginError').classList.remove('show');
  document.getElementById('adminLoginOverlay').classList.add('show');
  setTimeout(() => document.getElementById('adminPass').focus(), 100);
}
function closeAdminLogin() {
  document.getElementById('adminLoginOverlay').classList.remove('show');
}
function doAdminLogin() {
  const p = document.getElementById('adminPass').value;
  if (p === ADMIN_PASS) {
    isAdmin = true;
    closeAdminLogin();
    updateUI();
    showToast('管理员登录成功');
  } else {
    document.getElementById('adminLoginError').classList.add('show');
    document.getElementById('adminPass').value = '';
  }
}
function doAdminLogout() {
  isAdmin = false;
  updateUI();
  showToast('已退出管理员');
}
document.getElementById('adminPass').addEventListener('keypress', function(e) { if(e.key==='Enter') doAdminLogin(); });

// ===== 权限控制 UI 更新 =====
function updateUI() {
  // 管理员徽章
  document.getElementById('adminBadge').classList.toggle('hidden', !isAdmin);
  // 登录/退出按钮
  document.getElementById('btnLogin').classList.toggle('hidden', isAdmin);
  document.getElementById('btnLogout').classList.toggle('hidden', !isAdmin);
  // FAB 添加按钮
  document.getElementById('fabHome').classList.toggle('hidden', !isAdmin);
  document.getElementById('fabBuilding').classList.toggle('hidden', !isAdmin);
  // 只读提示
  document.getElementById('readonlyTipHome').classList.toggle('show', !isAdmin);
  document.getElementById('readonlyTipBuilding').classList.toggle('show', !isAdmin);
  // 重新渲染列表（刷新删除按钮等）
  renderHome(document.getElementById('searchHome').value.trim());
  if (currentCommunityId) renderBuilding(document.getElementById('searchBuilding').value.trim());
}

// ===== 高亮匹配 =====
function highlight(text, keyword) {
  if (!keyword) return escapeHtml(text);
  return escapeHtml(text).replace(new RegExp('(' + keyword.split('').map(c=>escapeRegExp(escapeHtml(c))).join('|') + ')', 'gi'),
    '<span class="highlight">$1</span>');
}
function escapeRegExp(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function escapeHtml(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ===== 首页搜索（穿透楼栋） =====
function onSearchHome() {
  const kw = document.getElementById('searchHome').value.trim();
  document.getElementById('clearHome').classList.toggle('show', kw.length > 0);
  renderHome(kw);
}
function clearSearchHome() {
  document.getElementById('searchHome').value = '';
  document.getElementById('clearHome').classList.remove('show');
  renderHome('');
}

let homeSort = 'input'; // input | name | elevator
function setHomeSort(type) {
  homeSort = type;
  document.querySelectorAll('#homeSortTabs .sort-tab').forEach(function(btn){
    btn.classList.toggle('active', btn.dataset.sort === type);
  });
  renderHome(document.getElementById('searchHome').value.trim());
}
function renderHome(keyword) {
  const container = document.getElementById('homeList');
  const grid = document.getElementById('homeGrid');
  let html = '';
  let gridHtml = '';
  let totalMatch = 0;

  let communities = data.communities.slice();
  if (homeSort === 'name') {
    communities.sort(function(a, b) { return a.name.localeCompare(b.name, 'zh-Hans-CN'); });
  } else if (homeSort === 'elevator') {
    communities.sort(function(a, b) {
      const ea = data.buildings.filter(x => x.communityId === a.id && x.hasElevator).length;
      const eb = data.buildings.filter(x => x.communityId === b.id && x.hasElevator).length;
      if (eb !== ea) return eb - ea; // 有电梯楼栋多的排前面
      return a.name.localeCompare(b.name, 'zh-Hans-CN');
    });
  }
  // input 顺序：保持原添加顺序

  communities.forEach(c => {
    const blds = data.buildings.filter(b => b.communityId === c.id);
    const nameMatch = !keyword || c.name.toLowerCase().includes(keyword.toLowerCase());
    const addrMatch = keyword && c.address.toLowerCase().includes(keyword.toLowerCase());
    const matchedBuildings = keyword
      ? blds.filter(b => b.buildingNumber.toLowerCase().includes(keyword.toLowerCase()) || b.remark.toLowerCase().includes(keyword.toLowerCase()))
      : [];

    const isMatch = (!keyword) || nameMatch || addrMatch || matchedBuildings.length > 0;
    if (!isMatch) return;

    totalMatch++;
    const bldCount = blds.length;
    const elevatorCount = blds.filter(b=>b.hasElevator).length;

    let matchTag = '';
    if (keyword) {
      if (nameMatch) matchTag = '<span class="match-tag">名称匹配</span>';
      else if (addrMatch) matchTag = '<span class="match-tag">地址匹配</span>';
      else if (matchedBuildings.length > 0) matchTag = '<span class="match-tag">楼栋匹配 · ' + matchedBuildings.length + '条</span>';
    }

    // 列表视图：卡片
    const delBtn = isAdmin
      ? '<div class="card-actions" onclick="event.stopPropagation();showDeleteAlert(\'community\',' + c.id + ')"><button class="btn-icon">🗑️</button></div>'
      : '<div class="card-actions"></div>';

    html += '<div class="card" onclick="enterCommunity(' + c.id + ',\'' + escapeHtml(c.name) + '\')">';
    html += '<div class="card-header">';
    html += '<div><div class="card-title">' + highlight(c.name, keyword) + matchTag + '</div>';
    if (c.address) html += '<div class="card-sub">' + highlight(c.address, keyword) + '</div>';
    html += '<div class="card-sub">📋 ' + bldCount + ' 栋楼 | 🔼 ' + elevatorCount + ' 栋有电梯</div></div>';
    html += delBtn;
    html += '</div></div>';

    if (matchedBuildings.length > 0) {
      matchedBuildings.forEach(b => {
        html += '<div class="card sub-building" style="margin-bottom:8px;padding:12px;" onclick="enterCommunity(' + c.id + ',\'' + escapeHtml(c.name) + '\')">';
        html += '<div style="display:flex;justify-content:space-between;align-items:center;">';
        html += '<div><span style="font-size:14px;font-weight:600;">📍 ' + highlight(b.buildingNumber, keyword) + '</span> ';
        html += '<span class="badge ' + (b.hasElevator?'badge-yes':'badge-no') + '">' + (b.hasElevator?'✅有电梯':'❌无电梯') + '</span></div>';
        html += '</div>';
        if (b.remark) html += '<div class="card-sub" style="margin-top:4px;">' + highlight(b.remark, keyword) + '</div>';
        html += '</div>';
      });
    }

    // 九宫格视图：方块
    const gridClass = isAdmin ? 'grid-item admin' : 'grid-item';
    const delTag = isAdmin
      ? '<button class="grid-del" onclick="event.stopPropagation();showDeleteAlert(\'community\',' + c.id + ')">🗑️</button>'
      : '';
    gridHtml += '<div class="' + gridClass + '" onclick="enterCommunity(' + c.id + ',\'' + escapeHtml(c.name) + '\')">';
    gridHtml += delTag;
    gridHtml += '<div class="grid-icon">🏘️</div>';
    gridHtml += '<div class="grid-name">' + highlight(c.name, keyword) + '</div>';
    gridHtml += '<div class="grid-sub">' + bldCount + ' 栋 / ' + elevatorCount + ' 电梯</div>';
    gridHtml += '</div>';
  });

  if (totalMatch === 0) {
    const empty = '<div class="empty-state"><div class="icon">🔍</div><div>' + (keyword ? '没有找到相关记录' : '还没有记录<br>登录管理员后点击右下角添加小区') + '</div></div>';
    html = empty;
    gridHtml = empty;
  }

  container.innerHTML = html;
  grid.innerHTML = gridHtml;

  // 根据当前视图切换显示
  applyHomeView();

  const rc = document.getElementById('resultCountHome');
  if (keyword) {
    rc.textContent = '找到 ' + totalMatch + ' 个小区' + (data.communities.length > totalMatch ? ' / 共 ' + data.communities.length + ' 个' : '');
  } else {
    rc.textContent = data.communities.length > 0 ? '共 ' + data.communities.length + ' 个小区' : '';
  }
}

// 切换首页视图：列表 / 九宫格
function setHomeView(view) {
  homeView = view;
  document.getElementById('btnViewList').classList.toggle('active', view === 'list');
  document.getElementById('btnViewGrid').classList.toggle('active', view === 'grid');
  applyHomeView();
}
function applyHomeView() {
  const isGrid = homeView === 'grid';
  document.getElementById('homeList').classList.toggle('hidden', isGrid);
  document.getElementById('homeGrid').classList.toggle('hidden', !isGrid);
}


// ===== 进入楼栋页 =====
function enterCommunity(id, name) {
  currentCommunityId = id;
  document.getElementById('buildingTitle').textContent = name;
  document.getElementById('pageHome').classList.remove('active');
  document.getElementById('pageBuilding').classList.add('active');
  document.getElementById('searchBuilding').value = '';
  document.getElementById('clearBuilding').classList.remove('show');
  renderBuilding('');
  // 更新楼栋页 FAB 和只读提示
  document.getElementById('fabBuilding').classList.toggle('hidden', !isAdmin);
  document.getElementById('readonlyTipBuilding').classList.toggle('show', !isAdmin);
}
function goBack() {
  document.getElementById('pageBuilding').classList.remove('active');
  document.getElementById('pageHome').classList.add('active');
  clearSearchHome();
  renderHome('');
}
function onSearchBuilding() {
  const kw = document.getElementById('searchBuilding').value.trim();
  document.getElementById('clearBuilding').classList.toggle('show', kw.length > 0);
  renderBuilding(kw);
}
function clearSearchBuilding() {
  document.getElementById('searchBuilding').value = '';
  document.getElementById('clearBuilding').classList.remove('show');
  renderBuilding('');
}

// 提取楼栋号中的数字用于自然排序（"1栋" < "2栋" < "10栋"）
function buildingNumberNum(str) {
  const m = String(str || '').match(/(\d+)/);
  return m ? parseInt(m[1], 10) : 0;
}

let buildingSort = 'number'; // number | input | elevator
function setSort(type) {
  buildingSort = type;
  document.querySelectorAll('#sortTabs .sort-tab').forEach(function(btn){
    btn.classList.toggle('active', btn.dataset.sort === type);
  });
  renderBuilding(document.getElementById('searchBuilding').value.trim());
}
function renderBuilding(keyword) {
  const blds = data.buildings.filter(b => b.communityId === currentCommunityId);
  let filtered = keyword
    ? blds.filter(b => b.buildingNumber.toLowerCase().includes(keyword.toLowerCase()) || b.remark.toLowerCase().includes(keyword.toLowerCase()))
    : blds.slice();

  // 排序
  if (buildingSort === 'number') {
    filtered.sort(function(a, b) { return buildingNumberNum(a.buildingNumber) - buildingNumberNum(b.buildingNumber); });
  } else if (buildingSort === 'elevator') {
    // 有电梯的排前面，同组内按楼栋号
    filtered.sort(function(a, b) {
      if (a.hasElevator !== b.hasElevator) return a.hasElevator ? -1 : 1;
      return buildingNumberNum(a.buildingNumber) - buildingNumberNum(b.buildingNumber);
    });
  }
  // input 顺序：保持原数组顺序（按 id 升序即录入顺序）

  const yes = blds.filter(b=>b.hasElevator).length;
  document.getElementById('statTotal').textContent = blds.length;
  document.getElementById('statYes').textContent = yes;
  document.getElementById('statNo').textContent = blds.length - yes;

  const container = document.getElementById('buildingList');
  if (filtered.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="icon">🏢</div><div>' + (keyword ? '没有匹配的楼栋' : '还没有楼栋记录<br>登录管理员后点击右下角添加') + '</div></div>';
  }

  let html = '';
  filtered.forEach(b => {
    // 电梯标签：仅管理员可点击切换
    const badgeClass = isAdmin ? '' : 'disabled';
    // 删除按钮：仅管理员可见
    const delBtn = isAdmin
      ? '<div class="card-actions"><button class="btn-icon" onclick="event.stopPropagation();showDeleteAlert(\'building\',' + b.id + ')">🗑️</button></div>'
      : '<div class="card-actions"></div>';

    html += '<div class="card building-card ' + (b.hasElevator?'yes-elevator':'no-elevator') + '">';
    html += '<div class="card-header">';
    html += '<div><div class="card-title">🏢 ' + highlight(b.buildingNumber, keyword) + '</div>';
    html += '<div style="margin-top:6px;"><span class="badge ' + (b.hasElevator?'badge-yes':'badge-no') + ' ' + badgeClass + '" onclick="event.stopPropagation();toggleElevator(' + b.id + ')">' + (b.hasElevator?'✅ 有电梯':'❌ 无电梯') + '</span></div>';
    if (b.remark) html += '<div class="card-sub" style="margin-top:4px;">📝 ' + highlight(b.remark, keyword) + '</div>';
    html += '</div>';
    html += delBtn;
    html += '</div></div>';
  });
  container.innerHTML = html;
}

// ===== 弹窗 =====
function openModal(type) {
  if (!isAdmin) { showToast('请先登录管理员'); return; }
  modalType = type;
  const modal = document.getElementById('modal');
  if (type === 'community') {
    document.getElementById('modalTitle').textContent = '添加小区';
    document.getElementById('label1').textContent = '小区名称 *';
    document.getElementById('input1').placeholder = '如：阳光花园';
    document.getElementById('label2').textContent = '地址（选填）';
    document.getElementById('input2').placeholder = '如：深圳市南山区科技园';
    document.getElementById('group2').style.display = 'block';
    document.getElementById('groupSwitch').style.display = 'none';
  } else {
    document.getElementById('modalTitle').textContent = '添加楼栋';
    document.getElementById('label1').textContent = '楼栋号 *';
    document.getElementById('input1').placeholder = '如：1栋、A座';
    document.getElementById('label2').textContent = '备注（选填）';
    document.getElementById('input2').placeholder = '如：靠马路一侧';
    document.getElementById('group2').style.display = 'block';
    document.getElementById('groupSwitch').style.display = 'block';
    hasElevatorVal = true;
    updateSwitchUI();
  }
  document.getElementById('input1').value = '';
  document.getElementById('input2').value = '';
  modal.classList.add('show');
  setTimeout(() => document.getElementById('input1').focus(), 100);
}
function closeModal() { document.getElementById('modal').classList.remove('show'); }
function toggleSwitch() {
  if (!isAdmin) return;
  hasElevatorVal = !hasElevatorVal;
  updateSwitchUI();
}
function updateSwitchUI() {
  const s = document.getElementById('elevatorSwitch');
  s.classList.toggle('on', hasElevatorVal);
  document.getElementById('switchLabel').textContent = hasElevatorVal ? '有电梯' : '无电梯';
}
function confirmModal() {
  if (!isAdmin) return;
  const v1 = document.getElementById('input1').value.trim();
  const v2 = document.getElementById('input2').value.trim();
  if (!v1) { showToast('请填写必填项'); return; }

  if (modalType === 'community') {
    data.communities.push({ id: Date.now(), name: v1, address: v2, createdAt: Date.now() });
    showToast('小区添加成功');
  } else {
    data.buildings.push({ id: Date.now(), communityId: currentCommunityId, buildingNumber: v1, hasElevator: hasElevatorVal, remark: v2, createdAt: Date.now() });
    showToast('楼栋添加成功');
  }
  save();
  closeModal();
  if (modalType === 'community') renderHome(document.getElementById('searchHome').value.trim());
  else renderBuilding(document.getElementById('searchBuilding').value.trim());
}

// ===== 删除 =====
function showDeleteAlert(type, id) {
  if (!isAdmin) { showToast('请先登录管理员'); return; }
  deleteTarget = { type, id };
  const item = type === 'community' ? data.communities.find(c=>c.id===id) : data.buildings.find(b=>b.id===id);
  const name = type === 'community' ? item.name : item.buildingNumber;
  document.getElementById('alertTitle').textContent = '确认删除';
  document.getElementById('alertMsg').textContent = type === 'community'
    ? '删除「' + name + '」及其所有楼栋记录？'
    : '删除「' + name + '」？';
  document.getElementById('alert').classList.add('show');
}
function closeAlert() { document.getElementById('alert').classList.remove('show'); }
function doDelete() {
  if (!isAdmin) return;
  if (deleteTarget.type === 'community') {
    data.communities = data.communities.filter(c => c.id !== deleteTarget.id);
    data.buildings = data.buildings.filter(b => b.communityId !== deleteTarget.id);
  } else {
    data.buildings = data.buildings.filter(b => b.id !== deleteTarget.id);
  }
  save();
  closeAlert();
  renderHome(document.getElementById('searchHome').value.trim());
  if (currentCommunityId) renderBuilding(document.getElementById('searchBuilding').value.trim());
  showToast('已删除');
}
document.getElementById('alert').addEventListener('click', function(e) { if(e.target===this) closeAlert(); });
document.getElementById('modal').addEventListener('click', function(e) { if(e.target===this) closeModal(); });
document.getElementById('adminLoginOverlay').addEventListener('click', function(e) { if(e.target===this) closeAdminLogin(); });

// ===== 切换电梯状态 =====
function toggleElevator(id) {
  if (!isAdmin) { showToast('请先登录管理员'); return; }
  const b = data.buildings.find(x => x.id === id);
  if (b) { b.hasElevator = !b.hasElevator; save(); renderBuilding(document.getElementById('searchBuilding').value.trim()); }
}

// ===== Toast =====
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ===== 数据管理：导出 / 导入 =====
function openDataMgr() {
  const c = data.communities.length, b = data.buildings.length;
  document.getElementById('dmStat').textContent = '当前共 ' + c + ' 个小区、' + b + ' 条楼栋记录';
  document.getElementById('dmExportDesc').textContent =
    c + b === 0 ? '暂无数据可导出' : '生成备份文件，存到手机';
  document.getElementById('dmExportRow').classList.toggle('disabled', c + b === 0);
  document.getElementById('dataMgrOverlay').classList.add('show');
}
function closeDataMgr() {
  document.getElementById('dataMgrOverlay').classList.remove('show');
  document.getElementById('dmPreviewBox').classList.add('hidden');
}
// 导出：把数据写成带日期的 JSON 文件下载到手机
// 生成备份文件内容（Blob + 文件名），供“导出”和“分享到微信”共用
function buildBackupBlob() {
  const pad = n => String(n).padStart(2, '0');
  const d = new Date();
  const stamp = d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate());
  const payload = {
    _meta: {
      app: '小区楼栋电梯记录',
      version: '1.0',
      exportTime: new Date().toLocaleString('zh-CN'),
      communities: data.communities.length,
      buildings: data.buildings.length
    },
    data: data
  };
  const blob = new Blob(['\ufeff' + JSON.stringify(payload, null, 2)], { type: 'application/json;charset=utf-8' });
  const filename = '电梯记录备份_' + stamp + '.json';
  return { blob: blob, filename: filename, payload: payload };
}

function doExport() {
  if (data.communities.length + data.buildings.length === 0) { showToast('暂无数据可导出'); return; }
  const { blob, filename } = buildBackupBlob();
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  closeDataMgr();
  showToast('已导出 ' + (data.communities.length + data.buildings.length) + ' 条数据');
}

function copyTextToClipboard(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text);
  }
  return new Promise(function(resolve, reject) {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      ok ? resolve() : reject(new Error('copy failed'));
    } catch (e) { reject(e); }
  });
}
// 微信内置浏览器提示：如何把备份文件发给对方

let pendingImport = null;
// 对比结果：{ newCommunities, updCommunities, newBuildings, updBuildings, sameCommunities, sameBuildings, isEmpty, total }
let pendingCompare = null;

// 取记录的时间戳（updatedAt 优先，其次 createdAt）
function recordTime(rec) {
  return Number(rec && (rec.updatedAt || rec.createdAt)) || 0;
}
function sameCommunity(a, b) {
  return a && b && (a.name || '') === (b.name || '') && (a.address || '') === (b.address || '');
}
function sameBuilding(a, b) {
  if (!a || !b) return false;
  return (a.communityId === b.communityId)
    && ((a.buildingNumber || '') === (b.buildingNumber || ''))
    && (a.hasElevator === b.hasElevator)
    && ((a.remark || '') === (b.remark || ''));
}
// 对比“备份”与“当前”，分类为：新增 / 更新 / 相同
function compareImport(incoming) {
  const curComMap = {}, curBldMap = {};
  (data.communities || []).forEach(c => { curComMap[c.id] = c; });
  (data.buildings || []).forEach(b => { curBldMap[b.id] = b; });
  const out = {
    newCommunities: [], updCommunities: [], sameCommunities: [],
    newBuildings: [], updBuildings: [], sameBuildings: [],
    isEmpty: true, total: 0
  };
  (incoming.communities || []).forEach(c => {
    const cur = curComMap[c.id];
    if (!cur) out.newCommunities.push(c);
    else if (recordTime(c) > recordTime(cur) || !sameCommunity(c, cur)) out.updCommunities.push(c);
    else out.sameCommunities.push(c);
  });
  (incoming.buildings || []).forEach(b => {
    const cur = curBldMap[b.id];
    if (!cur) out.newBuildings.push(b);
    else if (recordTime(b) > recordTime(cur) || !sameBuilding(b, cur)) out.updBuildings.push(b);
    else out.sameBuildings.push(b);
  });
  out.total = out.newCommunities.length + out.updCommunities.length
            + out.newBuildings.length + out.updBuildings.length;
  out.isEmpty = out.total === 0;
  return out;
}

document.getElementById('dmFile').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    let parsed = null, err = '';
    try {
      const raw = (ev.target.result || '').replace(/^\ufeff/, ''); // 去 BOM
      parsed = JSON.parse(raw);
    } catch (ex) { err = '文件格式损坏，不是有效的备份文件'; }
    if (!err) {
      const inner = (parsed && parsed.data) ? parsed.data : parsed;
      if (!inner || !Array.isArray(inner.communities) || !Array.isArray(inner.buildings)) {
        err = '备份文件内容不正确，缺少楼栋数据';
      } else {
        pendingImport = inner;
        pendingCompare = compareImport(inner);
      }
    }
    if (err) {
      showToast(err);
      pendingImport = null;
      pendingCompare = null;
    } else {
      showImportConfirm(pendingImport, parsed && parsed._meta ? parsed._meta : null);
    }
    e.target.value = ''; // 允许重复选择同一文件
  };
  reader.onerror = function() { showToast('读取文件失败'); };
  reader.readAsText(file, 'utf-8');
});

// 渲染导入确认弹窗：一致 / 有差异 两套文案 + 差异明细
function renderImportCompare(meta) {
  const iconEl = document.getElementById('dmCmIcon');
  const qEl = document.getElementById('dmCmQ');
  const infoEl = document.getElementById('dmCmInfo');
  const warnEl = document.getElementById('dmCmWarn');
  const cmpEl = document.getElementById('dmCmCompare');
  const okBtn = document.getElementById('dmCmOk');
  const mergeBtn = document.getElementById('dmCmMerge');

  const when = (meta && meta.exportTime) ? meta.exportTime : '未知时间';
  const totalIn = (pendingImport.communities || []).length + (pendingImport.buildings || []).length;
  const curTotal = (data.communities || []).length + (data.buildings || []).length;

  if (pendingCompare.isEmpty) {
    iconEl.textContent = '✅';
    qEl.textContent = '两份数据完全一致';
    infoEl.innerHTML = '导出时间：<b>' + when + '</b><br>备份记录：<b>' + totalIn + '</b> 条（与当前相同）';
    warnEl.textContent = '导入后与现在一模一样，通常无需重复导入';
    cmpEl.classList.add('hidden');
    okBtn.textContent = '仍然导入';
    mergeBtn.classList.add('hidden');
    return;
  }

  const cmp = pendingCompare;
  const newCount = cmp.newCommunities.length + cmp.newBuildings.length;
  const updCount = cmp.updCommunities.length + cmp.updBuildings.length;
  iconEl.textContent = '🔍';
  qEl.textContent = '检测到 ' + (newCount + updCount) + ' 条数据有变化';
  infoEl.innerHTML = '导出时间：<b>' + when + '</b><br>备份共 <b>' + totalIn + '</b> 条，当前 <b>' + curTotal + '</b> 条';
  warnEl.textContent = '⚠️ 直接“导入”会用整包备份覆盖当前数据';
  okBtn.textContent = '整包导入（覆盖）';
  okBtn.classList.remove('hidden');
  mergeBtn.classList.remove('hidden');

  let html = '';
  if (newCount > 0) {
    html += '<div class="dm-cv-line">🆕 <b>' + newCount + ' 条新记录</b>';
    html += '<span class="dm-cv-tag new">新增</span>';
    if (cmp.newCommunities.length) html += ' · 其中 ' + cmp.newCommunities.length + ' 个新小区';
    html += '</div>';
  }
  if (updCount > 0) {
    html += '<div class="dm-cv-line">🔄 <b>' + updCount + ' 条已更新</b>';
    html += '<span class="dm-cv-tag upd">覆盖更新</span>';
    if (cmp.updCommunities.length) html += ' · ' + cmp.updCommunities.length + ' 个小区有改动';
    html += '</div>';
  }
  const sameCount = cmp.sameCommunities.length + cmp.sameBuildings.length;
  if (sameCount > 0) {
    html += '<div class="dm-cv-line">✔️ <b>' + sameCount + ' 条完全相同</b>';
    html += '<span class="dm-cv-tag same">不变</span></div>';
  }
  cmpEl.innerHTML = html;
  cmpEl.classList.remove('hidden');
}

function showImportConfirm(payload, meta) {
  renderImportCompare(meta);
  document.getElementById('dmCmErr').classList.remove('show');
  document.getElementById('importConfirmOverlay').classList.add('show');
}

// 智能合并：新增补齐 + 更新的按 id 覆盖；相同与本地独有记录全部保留
function mergeImport(incoming) {
  const cmp = pendingCompare;
  const incomingMap = {};
  (incoming.communities || []).forEach(c => { incomingMap[c.id] = c; });
  (incoming.buildings || []).forEach(b => { incomingMap[b.id] = b; });

  const changedIds = {};
  (cmp.newCommunities || []).forEach(x => changedIds[x.id] = 1);
  (cmp.updCommunities || []).forEach(x => changedIds[x.id] = 1);
  (cmp.newBuildings || []).forEach(x => changedIds[x.id] = 1);
  (cmp.updBuildings || []).forEach(x => changedIds[x.id] = 1);

  const mergedCom = (data.communities || []).map(c => changedIds[c.id] && incomingMap[c.id] ? incomingMap[c.id] : c);
  const mergedBld = (data.buildings || []).map(b => changedIds[b.id] && incomingMap[b.id] ? incomingMap[b.id] : b);

  const seen = {};
  mergedCom.forEach(c => { seen[c.id] = 1; });
  mergedBld.forEach(b => { seen[b.id] = 1; });
  (incoming.communities || []).forEach(c => { if (!seen[c.id]) { mergedCom.push(c); seen[c.id] = 1; } });
  (incoming.buildings || []).forEach(b => { if (!seen[b.id]) { mergedBld.push(b); seen[b.id] = 1; } });

  return { communities: mergedCom, buildings: mergedBld };
}

document.getElementById('dmCmMerge').addEventListener('click', function() {
  if (!pendingImport) { closeImportConfirm(); return; }
  try {
    const merged = mergeImport(pendingImport);
    data = JSON.parse(JSON.stringify(merged));
    save();
    syncData();
    const total = data.communities.length + data.buildings.length;
    const added = pendingCompare.newCommunities.length + pendingCompare.newBuildings.length;
    const updated = pendingCompare.updCommunities.length + pendingCompare.updBuildings.length;
    pendingImport = null;
    pendingCompare = null;
    closeImportConfirm();
    closeDataMgr();
    currentCommunityId = null;
    renderHome('');
    if (typeof updateUI === 'function') updateUI();
    showToast('合并完成：新增 ' + added + ' 条，更新 ' + updated + ' 条，共 ' + total + ' 条');
  } catch (ex) {
    const errBox = document.getElementById('dmCmErr');
    errBox.textContent = '合并失败：' + (ex && ex.message ? ex.message : '数据写入异常');
    errBox.classList.add('show');
  }
});

document.getElementById('dmCmCancel').addEventListener('click', closeImportConfirm);
document.getElementById('importConfirmOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeImportConfirm();
});
document.getElementById('dmCmOk').addEventListener('click', function() {
  if (!pendingImport) { closeImportConfirm(); return; }
  try {
    data = JSON.parse(JSON.stringify(pendingImport)); // 深拷贝，避免引用污染
    save();                 // save() 内部会把 data 同步回 store.data
    syncData();             // 让全局 data 指向新对象，renderHome 才能读到
    const total = data.communities.length + data.buildings.length;
    pendingImport = null;
    pendingCompare = null;
    closeImportConfirm();
    closeDataMgr();
    currentCommunityId = null; // 回到首页
    renderHome('');
    if (typeof updateUI === 'function') updateUI();
    showToast('导入成功，共恢复 ' + total + ' 条数据');
  } catch (ex) {
    const errBox = document.getElementById('dmCmErr');
    errBox.textContent = '导入失败：' + (ex && ex.message ? ex.message : '数据写入异常');
    errBox.classList.add('show');
  }
});

function closeImportConfirm() {
  pendingImport = null;
  document.getElementById('importConfirmOverlay').classList.remove('show');
  document.getElementById('dmCmErr').classList.remove('show');
}
document.getElementById('dataMgrOverlay').addEventListener('click', function(e) { if (e.target === this) closeDataMgr(); });

// ===== 分享提示：再复制一次 =====
// ===== 初始化 =====
renderHome('');
updateUI();
</script>

</html>
